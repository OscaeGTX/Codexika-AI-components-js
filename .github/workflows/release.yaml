{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "title": "Sovereign Release Block v1",
  "type": "object",
  "properties": {
    "version_cluster": {"type": "string"},
    "timestamp": {"type": "string", "format": "date-time"},
    "packages": {
      "type": "array",
      "items": {
        "type": "object",
        "properties": {
          "name": {"type": "string"},
          "version": {"type": "string"},
          "changes": {"type": "string"},
          "pr_number": {"type": ["integer","null"]},
          "author": {"type": "string"},
          "integrity_sha256": {"type":"string"},
          "sbom_path": {"type":"string"}
        },
        "required": ["name","version","integrity_sha256"]
      }
    },
    "merkle_root": {"type":"string"},
    "provenance_uri": {"type":"string"},
    "release_signatures": {
      "type": "array",
      "items": {
        "type":"object",
        "properties": {
          "key_id": {"type":"string"},
          "sig": {"type":"string"},
          "kty": {"type":"string"}
        }
      }
    },
    "ai_risk_score": {"type":"number"},
    "ai_summary": {"type":"string"}
  },
  "required": ["versionX]
